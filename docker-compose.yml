services:
  platform:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_EMAIL_FROM: ${RESEND_EMAIL_FROM}
    restart: unless-stopped

  hwp-api:
    build:
      context: ./python
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped

  markitdown-api:
    build:
      context: ./python-markitdown
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      # Optional — enables image (.png/.jpg) transcription via OpenAI vision.
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MARKITDOWN_LLM_MODEL: ${MARKITDOWN_LLM_MODEL:-gpt-4o}
    restart: unless-stopped
